<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;background:#152130;font-family:Segoe UI,Arial,sans-serif}
#notice{position:absolute;top:15px;left:55px;right:15px;z-index:900;color:#d6e6f3;background:#162434e8;padding:9px 13px;border-radius:8px;font-size:12px;pointer-events:none}
.leaflet-tile-pane{filter:brightness(.68) saturate(.55)}
.leaflet-control-attribution{background:#172432dd!important;color:#ddd!important}.leaflet-control-attribution a{color:#81c8ef}
.vehicle{width:22px;height:22px;border:4px solid white;background:#4be1bf;border-radius:50%;box-shadow:0 0 0 9px #4be1bf33,0 2px 9px #0008;transition:transform .1s linear}
.endpoint{background:#203d58;border:2px solid #bfe4ff;border-radius:50%;color:white;text-align:center;line-height:25px;font-weight:700}
#fallback{position:absolute;width:100%;height:100%;inset:0;display:none}
</style></head><body><div id="map"></div><canvas id="fallback"></canvas><div id="notice">Загрузка карты…</div>
<script src="vendor/leaflet.js"></script><script>
let routePoints=[],passedPoints=[],vehiclePosition=null,map=null,routeLine=null,passedLine=null,vehicle=null,ends=[];
let tileLoaded=false; const notice=document.getElementById('notice');
function message(text){notice.textContent=text;notice.style.display=text?'block':'none';}
if(window.L){
 map=L.map('map',{zoomControl:false}).setView([43.85,39.4],9);
 L.control.zoom({zoomInTitle:'Приблизить',zoomOutTitle:'Отдалить'}).addTo(map);
 const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> — участники проекта'}).addTo(map);
 tiles.on('tileload',()=>{tileLoaded=true;message('');});
 tiles.on('tileerror',()=>message('Подложка недоступна · Маршрут и симуляция работают'));
 setTimeout(()=>{if(!tileLoaded)message('Нет подложки карты · Маршрут и симуляция работают');},6000);
 routeLine=L.polyline([],{color:'#79a7d8',weight:5,opacity:.8}).addTo(map);
 passedLine=L.polyline([],{color:'#49e2b5',weight:6}).addTo(map);
}else{document.getElementById('fallback').style.display='block';message('Библиотека карты недоступна · Показана схема маршрута');}
function endpoint(point,label){return L.marker(point,{icon:L.divIcon({className:'endpoint',html:label,iconSize:[27,27],iconAnchor:[14,14]})}).addTo(map);}
function initializeRoute(points){
 routePoints=points;passedPoints=[];vehiclePosition=points[0];
 if(map){
  ends.forEach(m=>map.removeLayer(m));ends=[endpoint(points[0],'А'),endpoint(points[points.length-1],'Б')];
  routeLine.setLatLngs(points);passedLine.setLatLngs([]);
  if(vehicle)map.removeLayer(vehicle);
  vehicle=L.marker(points[0],{zIndexOffset:1000,icon:L.divIcon({className:'',html:'<div class="vehicle"></div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[45,45]});
 }else drawFallback();
}
function updateVehicle(lat,lon){vehiclePosition=[lat,lon];if(vehicle){vehicle.setLatLng(vehiclePosition);if(!map.getBounds().pad(-.15).contains(vehiclePosition))map.panTo(vehiclePosition,{animate:true,duration:.4});}else drawFallback();}
function updatePassedRoute(points){passedPoints=points;if(passedLine)passedLine.setLatLngs(points);else drawFallback();}
function updateProgress(count,lat,lon){updateVehicle(lat,lon);updatePassedRoute(routePoints.slice(0,count).concat([[lat,lon]]));}
function resetVehicle(){if(routePoints.length){updatePassedRoute([]);updateVehicle(...routePoints[0]);}}
function drawFallback(){
 if(!routePoints.length)return;
 const canvas=document.getElementById('fallback'),ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;
 const xs=routePoints.map(p=>p[1]*Math.cos(routePoints[0][0]*Math.PI/180)),ys=routePoints.map(p=>-p[0]);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const scale=Math.min((innerWidth-90)/Math.max(maxX-minX,1e-5),(innerHeight-100)/Math.max(maxY-minY,1e-5));
 const xy=p=>[45+(p[1]*Math.cos(routePoints[0][0]*Math.PI/180)-minX)*scale,65+(-p[0]-minY)*scale];
 function line(points,color){ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();points.forEach((p,i)=>{let q=xy(p);i?ctx.lineTo(...q):ctx.moveTo(...q);});ctx.stroke();}
 line(routePoints,'#79a7d8');line(passedPoints,'#49e2b5');
 if(vehiclePosition){ctx.fillStyle='#49e2b5';ctx.beginPath();ctx.arc(...xy(vehiclePosition),9,0,Math.PI*2);ctx.fill();}
}
window.addEventListener('resize',()=>{if(map)map.invalidateSize();else drawFallback();});
window.mapReady=true;
</script></body></html>
